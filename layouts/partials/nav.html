<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand-logo" aria-label="DJ BUFALO">
      DJ BUFALO
    </a>

    <nav class="main-nav" aria-label="Primary Navigation">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if eq .Identifier "home" }} active{{ end }}" data-i18n data-es="{{ .Name }}" data-en="{{ .Params.name_en }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="header-meta">
      <!-- Language Switcher -->
      <div class="lang-switch" role="group" aria-label="Selector de idioma / Language Selector">
        <button type="button" class="lang-btn active" data-lang="es" aria-label="Español Porteño">ES</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
      </div>

      {{ partial "motto-tag.html" . }}
    </div>
  </div>
</header>
