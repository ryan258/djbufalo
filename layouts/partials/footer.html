<footer id="contact" class="site-footer">
  <div class="footer-main">
    <!-- Left: MANZIA Bookings imprint -->
    <div class="footer-imprint">
      <img src="{{ "images/manzia-bookings-logo.svg" | relURL }}" alt="MANZIA Bookings" class="manada-mark">
      <div class="stacked-tag" aria-hidden="true">
        <span>DISCOS</span>
        <span>FIESTAS</span>
        <span>COMUNIDAD</span>
        <span>BUENOS AIRES</span>
      </div>
    </div>

    <!-- Center: Booking contact -->
    <div class="footer-contact">
      <div class="contact-title" data-i18n data-es="FECHAS / CONTACTO" data-en="BOOKINGS / CONTACT">FECHAS / CONTACTO</div>
      <a href="mailto:{{ .Site.Params.booking_email }}" class="contact-email">
        <span>{{ .Site.Params.booking_email }}</span>
        <span aria-hidden="true">&rarr;</span>
      </a>
    </div>

      <div class="social-icons" aria-label="Social Profiles">
        <!-- Instagram -->
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">

            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <!-- Soundcloud -->
        <a href="https://soundcloud.com" target="_blank" rel="noopener noreferrer" aria-label="SoundCloud">

            <path d="M11.56 8.87V17h9.19a3.25 3.25 0 0 0 .69-6.43 5.42 5.42 0 0 0-5.19-3.7 5.51 5.51 0 0 0-4.69 2zM9.8 17V9.75a4.2 4.2 0 0 0-.8-.13V17zM7.6 17v-6.7a3 3 0 0 0-.8-.11V17zM5.4 17v-5.87c-.28.06-.55.15-.8.27V17zm-2.2 0v-4.5c-.28.23-.55.5-.8.8V17z"></path>

    <div data-i18n data-es="&copy; {{ now.Year }} DJ BUFALO. &nbsp; TODOS LOS DERECHOS RESERVADOS." data-en="&copy; {{ now.Year }} DJ BUFALO. &nbsp; ALL RIGHTS RESERVED.">&copy; {{ now.Year }} DJ BUFALO. &nbsp; TODOS LOS DERECHOS RESERVADOS.</div>
