<section id="sets" class="site-section">
  <div class="section-header">
    <h2 class="section-title" data-i18n data-es="SETS SELECCIONADOS" data-en="SELECTED SETS">SETS SELECCIONADOS</h2>
    <div class="section-tagline" data-i18n data-es="ARCHIVO SONORO &mdash;" data-en="SOUND ARCHIVE &mdash;">ARCHIVO SONORO &mdash;</div>
  </div>

  <div class="sets-layout">
    <!-- Left: Track Rows -->
    <div class="sets-col-left">
      <div class="sets-list">
        {{ range hugo.Data.sets.items }}
        <div class="set-row" data-id="{{ .id }}" data-title="{{ .title_es }}" data-title-en="{{ .title_en }}" data-bpm="{{ .bpm }}" data-audio="{{ printf "audio/%s.mp3" .id | relURL }}">
          <div class="set-thumb">
            <img src="{{ .image | relURL }}" alt="{{ .title_es }}" loading="lazy"
                 data-i18n-alt data-alt-es="{{ .title_es }}" data-alt-en="{{ .title_en }}">
          </div>

          <button class="play-btn" type="button" aria-pressed="false" aria-label="Reproducir {{ .title_es }} / Play {{ .title_en }}">
            <svg viewBox="0 0 24 24">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
          </button>

          <div class="set-info">
            <div class="set-title" data-i18n data-es="{{ .title_es }}" data-en="{{ .title_en }}">{{ .title_es }}</div>
            <div class="set-meta">
              <span data-i18n data-es="{{ .location_es }}" data-en="{{ .location_en }}">{{ .location_es }}</span>
              &nbsp;/&nbsp;
              <span data-i18n data-es="{{ .date_es }}" data-en="{{ .date_en }}">{{ .date_es }}</span>
            </div>
          </div>

          <div class="set-duration num-tabular">{{ .duration }}</div>
          <div class="set-more" aria-hidden="true">&bull;&bull;&bull;</div>
        </div>
        {{ end }}
      </div>

      <a href="{{ hugo.Data.sets.feature.link_url | relURL }}" class="feature-link">
        <span data-i18n data-es="{{ hugo.Data.sets.feature.link_text_es }}" data-en="{{ hugo.Data.sets.feature.link_text_en }}">{{ hugo.Data.sets.feature.link_text_es }}</span>
        <span aria-hidden="true">&rarr;</span>
      </a>
    </div>

    <!-- Right: Featured photo -->
    <div class="feature-img-card">
      <img src="{{ hugo.Data.sets.feature.image | relURL }}" alt="{{ hugo.Data.sets.feature.alt_es }}" loading="lazy"
           data-i18n-alt data-alt-es="{{ hugo.Data.sets.feature.alt_es }}" data-alt-en="{{ hugo.Data.sets.feature.alt_en }}">
    </div>
  </div>
</section>
