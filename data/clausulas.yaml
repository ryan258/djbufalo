# Booking contract excerpt shown on the EPK under the rider.
items:
  - es: "DURACIÓN. El set dura tres horas. Si el lugar cierra antes, el set se completa en la vereda (antecedente: Palermo, 2022)."
    en: "LENGTH. The set lasts three hours. If the venue closes early, the set is completed on the sidewalk (precedent: Palermo, 2022)."
  - es: "HORARIO. DJ Bufalo cierra. No abre, no toca en el medio y no comparte el cierre."
    en: "SLOT. DJ Bufalo closes. He does not open, does not play mid-bill and does not share the closing slot."
  - es: "LUCES. A las 04:17 se apaga la luz de cabina. La pista puede seguir iluminada, en tonos fríos y sin estroboscópica."
    en: "LIGHTING. At 04:17 the booth light goes off. The floor may stay lit, in cold tones and without strobes."
  - es: "PEDIDOS. No se pasan temas pedidos. Los pedidos por escrito se archivan con fecha."
    en: "REQUESTS. Requested songs are not played. Written requests are filed and dated."
  - es: "BÚFALO. El promotor no se referirá al búfalo en flyers, redes, prensa ni conversación con el público. Su presencia no se anuncia, no se confirma y no se niega."
    en: "BUFFALO. The promoter shall not refer to the buffalo on flyers, social media, press or in conversation with the public. Its presence is not announced, confirmed or denied."
  - es: "FOTOGRAFÍA. Una sola persona autorizada, sin flash. Las fotos van a salir todas iguales. Eso es correcto."
    en: "PHOTOGRAPHY. One authorized person, no flash. The photos will all come out the same. That is correct."
  - es: "PAGO. 50% a la firma y 50% antes de las 03:00. No se aceptan pagos en especie. Las facturas caseras no son un pago; se aceptan aparte."
    en: "PAYMENT. 50% on signing and 50% before 03:00. Payment in kind is not accepted. Homemade pastries are not payment; they are accepted separately."
  - es: "CANCELACIÓN. Si el promotor cancela, pierde la seña. Si la fecha se cancela por pedido de tema, se devuelve la seña completa y una copia del rider."
    en: "CANCELLATION. If the promoter cancels, the deposit is forfeited. If the date is cancelled over a song request, the full deposit is returned with a copy of the rider."
  - es: "FUERZA MAYOR. Se consideran fuerza mayor el corte de luz y la lluvia sobre la cabina. El amanecer no es fuerza mayor."
    en: "FORCE MAJEURE. Power cuts and rain on the booth count as force majeure. Sunrise does not."
  - es: "JURISDICCIÓN. Cualquier diferencia se resuelve en Chacarita, en persona, a las 15:00."
    en: "JURISDICTION. Any dispute is settled in Chacarita, in person, at 15:00."
