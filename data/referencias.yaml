# References from people who have worked a Bufalo night. Shown on the EPK under the press quotes.
items:
  - who: "RUIZ"
    role_es: "Dueño, Taller Ruiz (Chacarita)"
    role_en: "Owner, Ruiz's garage (Chacarita)"
    es: "Le pregunté si era legal. Me dijo que era prolijo. Pasaron siete años y todavía no sé qué contestarle a eso. Volvió todos los meses."
    en: "I asked him if it was legal. He said it was tidy. Seven years later I still don't know how to answer that. He came back every month."
  - who: "SONIDISTA"
    role_es: "Galpón 12"
    role_en: "Sound engineer, Galpón 12"
    es: "Las dos primeras noches subí a preguntar por la luz. La tercera entendí. Ahora la apago yo en otras fiestas, a las 04:17, y me miran raro."
    en: "The first two nights I went up to ask about the light. On the third I understood. Now I turn it off at other parties, at 04:17, and people look at me funny."
  - who: "ENCARGADO"
    role_es: "Local de Palermo (2022)"
    role_en: "Manager, Palermo venue (2022)"
    es: "Le corté el sonido a los noventa minutos. Se fueron ochenta y siete personas atrás de él. Al otro día me llamó el dueño. Prefiero no hablar de eso."
    en: "I cut his sound at ninety minutes. Eighty-seven people walked out after him. The owner called me the next day. I'd rather not talk about it."
  - who: "VECINA DEL 3ºA"
    role_es: "Chacarita"
    role_en: "Neighbor in 3A, Chacarita"
    es: "En 2020 tocaba los sábados en el living de abajo. Yo dejaba la puerta abierta. Nunca subió el volumen. Los que subíamos éramos nosotros, a escuchar desde la escalera."
    en: "In 2020 he played on Saturdays in the living room downstairs. I left my door open. He never turned it up. We were the ones who went down, to listen from the stairs."
  - who: "DUEÑA DEL LAVADERO"
    role_es: "Villa Crespo"
    role_en: "Laundromat owner, Villa Crespo"
    es: "Usó las secadoras 4 y 5 durante tres horas y no metió ropa. Pagó los ciclos igual. Es el mejor cliente que tuve."
    en: "He ran dryers 4 and 5 for three hours and never put any clothes in. Paid for every cycle anyway. Best customer I've ever had."
  - who: "CHOFER"
    role_es: "Colectivo, recorrido completo (dos veces)"
    role_en: "Bus driver, full route (twice)"
    es: "Pagó dos boletos. No le pregunté por el segundo. Paró el set en cada parada, justo. Le pedí una copia y me la mandó en casete."
    en: "He paid for two fares. I didn't ask about the second one. The set paused at every stop, exactly. I asked for a copy and he sent it on cassette."
