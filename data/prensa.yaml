# Press quotes for the EPK. All outlets are fictional.
items:
  - outlet: "REVISTA BAJADA LENTA"
    es: "Tocó tres horas. Lo cronometramos. Fueron tres horas."
    en: "He played three hours. We timed it. It was three hours."
  - outlet: "SUPLEMENTO TRASNOCHE"
    es: "No supimos qué preguntarle. Él tampoco."
    en: "We didn't know what to ask him. Neither did he."
  - outlet: "FANZINE PERSIANA"
    es: "El búfalo estuvo en la cabina toda la noche. Ninguna reseña lo mencionó. Lo mencionamos ahora, y no vamos a volver a hacerlo."
    en: "The buffalo was in the booth all night. No review mentioned it. We are mentioning it now, and we will not do so again."
  - outlet: "BOLETÍN DEL GALPÓN"
    es: "Una de las tres mejores sesiones del año. Las otras dos también fueron suyas."
    en: "One of the three best sets of the year. The other two were also his."
  - outlet: "AGENDA NOCTURNA PORTEÑA"
    es: "Pedimos una foto de prensa sonriendo. Nos mandaron la misma foto, con un recibo de lectura."
    en: "We requested a smiling press photo. They sent the same photo, with a read receipt."
  - outlet: "RADIO DE TRASNOCHE (AM)"
    es: "Durante la entrevista en vivo hubo cuarenta segundos de silencio. Los oyentes llamaron para pedir que se repitieran."
    en: "During the live interview there were forty seconds of silence. Listeners called in asking for a repeat."
