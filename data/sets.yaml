  - id: prueba-de-sonido
    title_es: "PRUEBA DE SONIDO (COMPLETA)"
    title_en: "SOUNDCHECK (FULL LENGTH)"
    location_es: "Galpón 12, Chacarita"
    location_en: "Galpón 12, Chacarita"
    date_es: "26 Sep 2023"
    date_en: "26 Sep 2023"
    duration: "03:04:51"
    image: "images/set-galpon12.webp"
    bpm: 126
    note_es: "Iba a ser una prueba de diez minutos. Nadie se animó a cortarla. Las puertas abrieron con el set a la mitad y la gente entró en silencio, como a misa empezada."
    note_en: "It was meant to be a ten-minute check. Nobody dared cut it. Doors opened halfway through and people came in quietly, like walking into mass late."

  - id: linea-152
    title_es: "IDA Y VUELTA, DOS VECES"
    title_en: "THERE AND BACK, TWICE"
    location_es: "Colectivo, recorrido completo"
    location_en: "City bus, full route"
    date_es: "21 Mar 2024"
    date_en: "21 Mar 2024"
    duration: "03:12:40"
    image: "images/set-manada.webp"
    bpm: 125
    note_es: "Un recorrido completo, ida y vuelta, dos veces. El chofer pidió una copia. Los cambios coinciden con las paradas; los frenos no fueron editados."
    note_en: "A full route, there and back, twice. The driver asked for a copy. Transitions land on the stops; the braking was not edited."

