# Extra Historia (bio) content: rendered by layouts/bio/single.html after the opening chapters.
chapters:
  - title_es: "04. LO QUE NO HACE"
    title_en: "04. WHAT HE DOESN'T DO"
    es: "No hace stories. No sube la cabina a las redes. No sonríe en las fotos de prensa, aunque se le pidió por escrito en dos oportunidades. No usa auriculares de un solo lado ni levanta las manos cuando entra el bombo: el bombo entra igual. Su resumen anual de streaming fue un solo tema, de diez minutos y cuatro segundos, escuchado 1.412 veces. No dio explicaciones al respecto."
    en: "He doesn't post stories. He doesn't film the booth. He doesn't smile in press photos, despite being asked in writing on two occasions. He doesn't wear one-ear headphones or raise his hands when the kick comes in: the kick comes in regardless. His year-end streaming recap was a single track, ten minutes and four seconds long, played 1,412 times. No explanation was offered."

  - title_es: "05. EL RIDER COMO REGLAMENTO"
    title_en: "05. THE RIDER AS RULEBOOK"
    es: "Los promotores lo leen como una lista de exigencias. Es un registro de accidentes. El renglón de la cabina a oscuras se agregó en 2021, después de una noche en que un tubo fluorescente parpadeaba a 122 BPM y arruinó dos horas de mezcla a 126. El de la mesa nivelada, después de un vaso de agua que caminó solo hasta el borde durante un cierre. El rider se actualiza como un reglamento ferroviario: después del incidente, nunca antes, y sin quitar nada."
    en: "Promoters read it as a list of demands. It is an incident log. The dark booth line was added in 2021, after a night when a fluorescent tube flickered at 122 BPM and ruined two hours of mixing at 126. The level table line, after a glass of water walked itself to the edge during a closing set. The rider is updated like a railway rulebook: after the incident, never before, and nothing is ever removed."

  - title_es: "06. MANZIA BOOKINGS, POR DENTRO"
    title_en: "06. MANZIA BOOKINGS, FROM THE INSIDE"
    es: "Manzia Bookings es un primer piso en Chacarita, un escritorio, dos sillas y una agenda que se lleva en papel. Atiende de lunes a viernes de 15:00 a 19:00, que según la agencia es 'la madrugada de los que trabajan de noche'. Rechaza cuatro de cada cinco propuestas. Los motivos más frecuentes, en orden: sets de menos de tres horas, cierres compartidos, y pedidos de que el búfalo 'interactúe con el público'."
    en: "Manzia Bookings is a first-floor office in Chacarita, one desk, two chairs and a paper diary. It is open Monday to Friday, 15:00 to 19:00, which the agency calls 'the small hours for people who work nights'. It turns down four out of five offers. The most common reasons, in order: sets shorter than three hours, shared closing slots, and requests that the buffalo 'interact with the crowd'."

timeline:
  - year: "2019"
    es: "Taller Ruiz. Primera fecha. Catorce personas, la persiana a la altura de la rodilla."
    en: "Ruiz's garage. First date. Fourteen people, shutter at knee height."
  - year: "2019"
    es: "BUF-000. La prueba de prensaje se aprueba con un movimiento de cabeza."
    en: "BUF-000. The test pressing is approved with a nod."
  - year: "2020"
    es: "Año sin fechas. Tres horas cada sábado en un living de Chacarita, a puerta cerrada. Los vecinos del 3ºA no se quejaron. Dejaron su puerta abierta."
    en: "A year without dates. Three hours every Saturday in a Chacarita living room, door closed. The neighbors in 3A never complained. They left their door open."
  - year: "2021"
    es: "Se agrega al rider el renglón 'cabina a oscuras'."
    en: "The 'dark booth' line is added to the rider."
  - year: "2022"
    es: "Palermo. Le cortan el sonido a los noventa minutos. Termina el set en la vereda. Desde entonces, el contrato dice tres horas."
    en: "Palermo. His sound is cut at ninety minutes. He finishes the set on the sidewalk. Since then, the contract says three hours."
  - year: "2023"
    es: "Galpón 12. La prueba de sonido dura tres horas. Primera grabación oficial del archivo."
    en: "Galpón 12. The soundcheck lasts three hours. First official archive recording."
  - year: "2024"
    es: "BUF-004 sale en casete sin anuncio. Se agota sin anuncio."
    en: "BUF-004 comes out on cassette without announcement. Sells out without announcement."
  - year: "2025"
    es: "Nunca Apura La Bajada EP. 300 copias prensadas en Buenos Aires. Quedan algunas."
    en: "Never Rushes The Drop EP. 300 copies pressed in Buenos Aires. A few remain."
  - year: "2026"
    es: "La Mirada Clavada. Primera entrevista de prensa. No se publicó."
    en: "The Long Stare. First press interview. It never ran."
  - year: "2027"
    es: "Primera fecha fuera del país. Asiento de pasillo."
    en: "First date abroad. Aisle seat."

faq:
  - q_es: "¿De dónde salió el búfalo?"
    q_en: "Where did the buffalo come from?"
    a_es: "Está en la cabina desde la apertura de puertas. Se recomienda llegar temprano."
    a_en: "He has been in the booth since doors opened. Arriving early is recommended."
  - q_es: "¿Es una persona disfrazada?"
    q_en: "Is it a person in a costume?"
    a_es: "El rider especifica dos CDJ-3000 y un mixer DJM-A9 o V10. No especifica nada más."
    a_en: "The rider specifies two CDJ-3000s and a DJM-A9 or V10 mixer. It specifies nothing else."
  - q_es: "¿Puedo pedir un tema?"
    q_en: "Can I request a song?"
    a_es: "Se puede pedir. No se va a pasar. Se recomienda hacerlo antes de las 04:00, para no interrumpir nada importante."
    a_en: "You may request one. It will not be played. Please do so before 04:00, so as not to interrupt anything important."
  - q_es: "¿Por qué tres horas?"
    q_en: "Why three hours?"
    a_es: "Porque es lo que tarda."
    a_en: "Because that is how long it takes."
  - q_es: "¿Hace sets más cortos?"
    q_en: "Does he play shorter sets?"
    a_es: "Hizo uno, en 2022. Lo terminó en la vereda."
    a_en: "He played one, in 2022. He finished it on the sidewalk."
  - q_es: "¿Qué significa 'nunca apura la bajada'?"
    q_en: "What does 'never rushes the drop' mean?"
    a_es: "Que no la apura."
    a_en: "That he doesn't rush it."
  - q_es: "¿Tiene redes sociales?"
    q_en: "Is he on social media?"
    a_es: "Tiene una cuenta. Publica la fecha, el horario y la dirección. Las fotos las saca otra persona y salen todas iguales."
    a_en: "There is one account. It posts the date, the time and the address. Someone else takes the photos, and they all come out the same."
  - q_es: "¿Toca en casamientos?"
    q_en: "Does he play weddings?"
    a_es: "Ver agenda, 13 de marzo."
    a_en: "See the schedule, March 13."

# term stays in Spanish in both languages; gloss_en is the English hint shown in EN mode.
glossary:
  - term: "BAJAR LA PERSIANA"
    gloss_en: "closing the shutter"
    es: "Cerrar la noche. No se usa para otra cosa."
    en: "To close the night. It is not used for anything else."
  - term: "TRES HORAS"
    gloss_en: "three hours"
    es: "Unidad de medida. Equivale a un set."
    en: "A unit of measurement. Equal to one set."
  - term: "APURAR LA BAJADA"
    gloss_en: "rushing the drop"
    es: "Lo que no se hace."
    en: "What is not done."
  - term: "FIRULETE"
    gloss_en: "flourish"
    es: "Cualquier cosa agregada para que la miren. Ejemplo: un eco en el último compás. Ejemplo: levantar las manos."
    en: "Anything added to be looked at. Example: an echo on the last bar. Example: raising your hands."
  - term: "MANGAZO"
    gloss_en: "a favor being called in"
    es: "Pedido de lista, de entrada, de tema o de pendrive. Se responde con silencio o con una birra, según la hora."
    en: "A request for the guestlist, a ticket, a song or a USB slot. Answered with silence or a beer, depending on the hour."
  - term: "BOMBO A TIERRA"
    gloss_en: "four on the floor"
    es: "La única manera de entrar a una pista que no necesita explicación."
    en: "The only way into a dancefloor that requires no explanation."
  - term: "CABINA A OSCURAS"
    gloss_en: "dark booth"
    es: "Renglón cuatro del rider. Se cumple a las 04:17."
    en: "Line four of the rider. Enforced at 04:17."
  - term: "LA MIRADA CLAVADA"
    gloss_en: "the long stare"
    es: "Expresión de Bufalo durante el set. También antes y después."
    en: "Bufalo's expression during the set. Also before and after."
  - term: "LOS QUE MIRABAN"
    gloss_en: "the ones who were watching"
    es: "Quienes se van antes de las 06:00. No es un reproche. Es una descripción."
    en: "Those who leave before 06:00. It is not a reproach. It is a description."
