items:
  - id: merch-tee
    title_es: "REMERA BOXY PESADA (240G)"
    title_en: "HEAVYWEIGHT BOXY TEE (240GSM)"
    code: "MERCH-01"
    desc_es: "Algodón 100% pesado de corte amplio. Serigrafía al agua en frente y espalda con la leyenda 'NUNCA APURA LA BAJADA'. Fabricada en Buenos Aires."
    desc_en: "100% heavyweight cotton, boxy fit. Water-based screenprint on front and back with 'NEVER RUSHES THE DROP'. Made in Buenos Aires."
    price: "$42.000 ARS / $35 USD"
    status_es: "DISPONIBLE"
    status_en: "IN STOCK"
    status_type: "active"
    badge_es: "CÁPSULA 01"
    badge_en: "CAPSULE 01"
    image: "images/stamp-buenas-pistas.webp"
    care_es: "Lavar al revés, en frío. No planchar sobre la leyenda. No apurar el secado."
    care_en: "Wash inside out, cold. Do not iron over the slogan. Do not rush the drying."

  - id: merch-slipmats
    title_es: "SLIPMATS 12\" EDICIÓN CABINA (PAR)"
    title_en: "12\" BOOTH EDITION SLIPMATS (PAIR)"
    code: "MERCH-02"
    desc_es: "Fieltro de alta densidad para vinilos. Tipografía en contraste hueso sobre negro: 'LA PISTA TAMBIÉN ES NUESTRA'. Tratamiento antiestático."
    desc_en: "High-density felt for vinyl turntables. Bone type on black: 'LA PISTA TAMBIÉN ES NUESTRA'. Antistatic treatment."
    price: "$28.000 ARS / $25 USD"
    status_es: "ÚLTIMAS UNIDADES"
    status_en: "FEW LEFT"
    status_type: "low"
    badge_es: "PRO / CABINA"
    badge_en: "PRO / BOOTH"
    image: "images/stamp-different-night.webp"
    care_es: "Sacudir después de cada cierre. No lavar. No prestar."
    care_en: "Shake out after every closing set. Do not wash. Do not lend."

  - id: merch-lighter
    title_es: "ENCENDEDOR METÁLICO & LLAVERO BUF-019"
    title_en: "METALLIC LIGHTER & BUF-019 KEYRING"
    code: "MERCH-03"
    desc_es: "Metal negro mate con grabado láser de coordenadas de Chacarita y logo Manzia Bookings. Edición de trasnoche."
    desc_en: "Matte black metal with laser-engraved Chacarita coordinates and Manzia Bookings mark. Night edition."
    price: "$18.000 ARS / $15 USD"
    status_es: "AGOTADO"
    status_en: "SOLD OUT"
    status_type: "soldout"
    badge_es: "EDICIÓN AGOTADA"
    badge_en: "SOLD OUT"
    image: "images/chacarita-wall.webp"
    care_es: "Recargar con gas butano. No usar dentro de la cabina."
    care_en: "Refill with butane. Do not use inside the booth."

  - id: merch-earplugs
    title_es: "TAPONES DE OÍDO DE CABINA (PAR)"
    title_en: "BOOTH EARPLUGS (PAIR)"
    code: "MERCH-04"
    desc_es: "Silicona de filtro plano: atenúan 18 dB parejo en todo el espectro. El set sigue sonando igual, solo que un poco más lejos. Estuche metálico con la leyenda 'DEJAR QUE LA MÚSICA RESPIRE'."
    desc_en: "Flat-filter silicone: 18 dB of even attenuation across the spectrum. The set sounds exactly the same, only slightly further away. Metal case reading 'LET THE MUSIC BREATHE'."
    price: "$12.000 ARS / $10 USD"
    status_es: "DISPONIBLE"
    status_en: "IN STOCK"
    status_type: "active"
    badge_es: "PROTECCIÓN"
    badge_en: "PROTECTION"
    image: "images/stamp-different-night.webp"
    care_es: "Enjuagar con agua tibia. Guardar en el estuche. No compartir."
    care_en: "Rinse in warm water. Keep in the case. Do not share."

  - id: merch-towel
    title_es: "TOALLA DE CABINA 'CERO FIRULETES'"
    title_en: "'NO GIMMICKS' BOOTH TOWEL"
    code: "MERCH-05"
    desc_es: "Algodón peinado, 40 x 80 cm, bordado tono sobre tono. Diseñada para colgar del costado del mixer. Nunca fue usada en cabina. Se vende igual."
    desc_en: "Combed cotton, 40 x 80 cm, tone-on-tone embroidery. Designed to hang off the side of the mixer. Has never been used in a booth. Sold regardless."
    price: "$22.000 ARS / $19 USD"
    status_es: "ÚLTIMAS UNIDADES"
    status_en: "FEW LEFT"
    status_type: "low"
    badge_es: "TEXTIL"
    badge_en: "TEXTILE"
    image: "images/stamp-buenas-pistas.webp"
    care_es: "Lavar con poco jabón. Doblar en tres. Colgar del costado izquierdo del mixer, donde no se va a usar."
    care_en: "Wash with little soap. Fold in three. Hang on the left side of the mixer, where it will not be used."

  - id: merch-shutter
    title_es: "PERSIANA METÁLICA 1:1 (A PEDIDO)"
    title_en: "1:1 METAL SHUTTER (MADE TO ORDER)"
    code: "MERCH-06"
    desc_es: "Réplica exacta de la persiana del Taller Ruiz. Chapa galvanizada, 3,2 x 2,4 m, con tope fijo a la altura de la rodilla. Se entrega por flete. Instalación no incluida. Se fabrica una por vez."
    desc_en: "Exact replica of the Ruiz garage shutter. Galvanized steel, 3.2 x 2.4 m, with a fixed stop at knee height. Delivered by freight. Installation not included. Built one at a time."
    price: "CONSULTAR / ASK"
    status_es: "A PEDIDO"
    status_en: "MADE TO ORDER"
    status_type: "low"
    badge_es: "OBJETO PESADO"
    badge_en: "HEAVY OBJECT"
    image: "images/chacarita-wall.webp"
    care_es: "Aceitar las guías cada seis meses. No subirla por encima del tope."
    care_en: "Oil the rails every six months. Do not raise it past the stop."

  - id: merch-certificate
    title_es: "CERTIFICADO DE NO HABER PEDIDO TEMAS"
    title_en: "CERTIFICATE OF HAVING REQUESTED NOTHING"
    code: "MERCH-07"
    desc_es: "Hoja A5, papel de algodón, sello en seco de Manzia Bookings. Se entrega en la puerta a las 06:00 a quienes no pidieron ningún tema en toda la noche. No se vende. Figura en la cápsula por transparencia."
    desc_en: "A5 sheet, cotton paper, Manzia Bookings blind stamp. Handed out at the door at 06:00 to anyone who requested no songs all night. Not for sale. Listed in the capsule for transparency."
    price: "NO SE VENDE / NOT FOR SALE"
    status_es: "SOLO EN PUERTA"
    status_en: "DOOR ONLY"
    status_type: "soldout"
    badge_es: "SE GANA"
    badge_en: "EARNED"
    image: "images/bio-crowd.webp"
    care_es: "Enmarcar sin vidrio antirreflejo. Se lee mejor con poca luz."
    care_en: "Frame without anti-glare glass. Reads best in low light."
