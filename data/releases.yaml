items:
  - id: buf-019
    cat_no: "BUF-019"
    title_es: "LA MIRADA CLAVADA"
    title_en: "THE LONG STARE"
    format: "12\" VINILO / DIGITAL"
    year: "2026"
    bpm: 126
    desc_es: "Dos cortes extendidos diseñados para el cierre en galpones porteños. Bajada lenta, percusión analógica seca y sub-graves directos."
    desc_en: "Two extended club cuts built for Buenos Aires late-night closures. Slow drop, dry analog percussion and direct sub-bass."
    tracks:
      - side: "A1"
        title: "La Mirada Clavada (Club Mix)"
        duration: "08:42"
      - side: "B1"
        title: "Chacarita Nocturna (Dub)"
        duration: "07:15"
    status_es: "EN STOCK / TIENDA"
    status_en: "IN STOCK / STORE"
    image: "images/sets-feature-historia.webp"
    notes_es: "Grabado en una sola toma. Se intentó una segunda para comparar. Era igual. Se conservó la primera por antigüedad."
    notes_en: "Recorded in a single take. A second was attempted for comparison. It was identical. The first was kept on seniority."
    review_outlet: "DISQUERÍA DEL PASAJE"
    review_es: "Lo pusimos en la vidriera. La gente se paraba a mirarlo un rato largo y seguía caminando."
    review_en: "We put it in the window. People would stop and look at it for a long time, then keep walking."

  - id: buf-012
    cat_no: "BUF-012"
    title_es: "NUNCA APURA LA BAJADA EP"
    title_en: "NEVER RUSHES THE DROP EP"
    format: "12\" VINILO (EDICIÓN LIMITADA 300 COPIAS)"
    year: "2025"
    bpm: 125
    desc_es: "Edición prensada en Buenos Aires. Sonido denso sin artificios. Grabado en vivo en la cabina de Chacarita a las 05:00."
    desc_en: "Pressed in Buenos Aires. Dense club sound without gimmicks. Recorded live from the Chacarita booth at 05:00."
    tracks:
      - side: "A1"
        title: "Nunca Apura La Bajada"
        duration: "09:12"
      - side: "A2"
        title: "Cero Firuletes"
        duration: "06:30"
      - side: "B1"
        title: "Persiana Abajo"
        duration: "10:04"
    status_es: "ÚLTIMAS COPIAS"
    status_en: "LAST COPIES"
    image: "images/set-galpon12.webp"
    notes_es: "La cara B termina con cuatro segundos de ruido de persiana. No es un efecto: el micrófono de ambiente quedó abierto y nadie lo cerró."
    notes_en: "Side B ends with four seconds of shutter noise. It is not an effect: the room mic was left open and nobody closed it."
    review_outlet: "BATEA USADOS CHACARITA"
    review_es: "Recomendado para escuchar a las 05:00. A otra hora también funciona, pero se nota que es otra hora."
    review_en: "Recommended listening at 05:00. It works at other times too, but you can tell it is another time."

  - id: buf-004
    cat_no: "BUF-004"
    title_es: "SESIONES DE TRASNOCHE"
    title_en: "AFTERHOURS SESSIONS"
    format: "CASETE C-60 / DIGITAL"
    year: "2024"
    bpm: 128
    desc_es: "Cinta de archivo directo de mesa. Crudo, sin masterizar para streaming, pensado para escuchar de madrugada."
    desc_en: "Direct soundboard tape archive. Raw, unmastered for streaming, engineered for the early hours."
    tracks:
      - side: "LADO A"
        title: "Galpón 12 Live Excerpt"
        duration: "29:45"
      - side: "LADO B"
        title: "Terraza Sunrise Tool"
        duration: "30:15"
    status_es: "AGOTADO / ARCHIVO"
    status_en: "SOLD OUT / ARCHIVE"
    image: "images/set-terraza.webp"
    notes_es: "Las cintas se duplicaron en tiempo real, una por una, en una casetera doble. Tardaron sesenta horas. Nadie aceleró el proceso."
    notes_en: "The tapes were duplicated in real time, one by one, on a double-deck. It took sixty hours. Nobody sped up the process."
    review_outlet: "FERIA DE CASETES (DOMINGOS)"
    review_es: "Se agotó en una tarde. Una persona volvió a la semana para preguntar si había lado C."
    review_en: "Sold out in one afternoon. One person came back a week later to ask whether there was a side C."

  - id: buf-021
    cat_no: "BUF-021"
    title_es: "REMIXES QUE NADIE PIDIÓ"
    title_en: "REMIXES NOBODY ASKED FOR"
    format: "12\" VINILO / DIGITAL"
    year: "2026"
    bpm: 126
    desc_es: "Tres remixes de La Mirada Clavada, hechos por el autor. Se escuchó el original durante cuatro meses buscando qué cambiar. No se encontró nada. El radio edit no se pudo acortar."
    desc_en: "Three remixes of The Long Stare, made by the author. The original was studied for four months for something to change. Nothing was found. The radio edit could not be shortened."
    tracks:
      - side: "A1"
        title: "La Mirada Clavada (Bufalo Remix)"
        duration: "08:42"
      - side: "B1"
        title: "La Mirada Clavada (Bufalo Dub Remix)"
        duration: "08:42"
      - side: "B2"
        title: "La Mirada Clavada (Radio Edit)"
        duration: "08:42"
    status_es: "PREVENTA / DICIEMBRE"
    status_en: "PRE-ORDER / DECEMBER"
    image: "images/stamp-buenas-pistas.webp"
    notes_es: "Se probó subir el tempo a 127. Se volvió a 126. Se probó sacar el bombo. Se volvió a poner. El trabajo de remezcla consistió en confirmar."
    notes_en: "Raising the tempo to 127 was tested. It went back to 126. Removing the kick was tested. It went back in. The remix work consisted of confirming."
    review_outlet: "BOLETÍN DEL GALPÓN"
    review_es: "No encontramos diferencias entre las tres versiones. El sello confirma que no las hay."
    review_en: "We found no difference between the three versions. The label confirms there is none."

  - id: buf-009
    cat_no: "BUF-009"
    title_es: "04:17 (SILENCIO DE CABINA)"
    title_en: "04:17 (BOOTH SILENCE)"
    format: "7\" VINILO / SURCO CERRADO"
    year: "2025"
    bpm: 0
    desc_es: "Grabación de campo de Galpón 12 en el instante en que se apaga la última luz de cabina. Surco cerrado: gira hasta que alguien levanta la púa. Nadie la levantó en la sesión de mastering."
    desc_en: "Field recording of Galpón 12 at the instant the last booth light goes out. Locked groove: it spins until someone lifts the needle. Nobody lifted it during mastering."
    tracks:
      - side: "A"
        title: "04:17"
        duration: "∞"
      - side: "B"
        title: "04:17 (Cara B, misma luz)"
        duration: "∞"
    status_es: "ÚLTIMAS COPIAS"
    status_en: "LAST COPIES"
    image: "images/stamp-different-night.webp"
    notes_es: "La duración figura como infinita por exigencia de la distribuidora, que no aceptó 'hasta que alguien levante la púa' como dato técnico."
    notes_en: "The running time is listed as infinite at the distributor's insistence; they would not accept 'until someone lifts the needle' as technical data."
    review_outlet: "DISQUERÍA DEL PASAJE"
    review_es: "Lo pusimos a prueba en el local. Cerramos a las 20:00. Seguía girando a la mañana."
    review_en: "We tested it in the shop. We closed at 20:00. It was still spinning in the morning."

  - id: buf-000
    cat_no: "BUF-000"
    title_es: "PRUEBA DE PRENSAJE"
    title_en: "TEST PRESSING"
    format: "12\" TEST PRESS (1 COPIA)"
    year: "2019"
    bpm: 126
    desc_es: "Única copia existente del primer prensaje. Fue escuchada una vez, de pie, en la planta. Aprobada con un movimiento de cabeza. No está a la venta; figura en el catálogo para que el número cero no quede vacío."
    desc_en: "The only existing copy of the first pressing. It was played once, standing, at the plant. Approved with a nod. Not for sale; it is listed so that catalog number zero is not left empty."
    tracks:
      - side: "A1"
        title: "Sin Título (Taller Ruiz)"
        duration: "11:20"
      - side: "B1"
        title: "Sin Título (La Misma, Más Tarde)"
        duration: "11:20"
    status_es: "ARCHIVO / NO DISPONIBLE"
    status_en: "ARCHIVE / UNAVAILABLE"
    image: "images/bio-crowd.webp"
    notes_es: "La planta ofreció prensar una segunda copia de respaldo. Se rechazó. El acta dice: 'si se rompe, se rompe'."
    notes_en: "The plant offered to press a backup copy. It was declined. The minutes read: 'if it breaks, it breaks'."
    review_outlet: "PLANTA DE PRENSADO (ACTA INTERNA)"
    review_es: "Aprobado. Sin observaciones. Sin palabras."
    review_en: "Approved. No remarks. No words."
