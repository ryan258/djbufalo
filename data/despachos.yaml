# Past newsletter ("Despacho") issues, newest first. Rendered at /despachos/.
items:
  - num: "020"
    date_es: "11 Nov 2026 · 04:17"
    date_en: "11 Nov 2026 · 04:17"
    subject_es: "Una fecha afuera"
    subject_en: "One date abroad"
    es: "Hay una fecha fuera del país, en febrero. Se viaja en asiento de pasillo. No se aceptan consultas sobre la puerta. La puerta tampoco las acepta."
    en: "There is a date abroad, in February. Travel is aisle seat. Questions about the door are not accepted. The door does not accept them either."

  - num: "019"
    date_es: "02 Oct 2026 · 04:17"
    date_en: "02 Oct 2026 · 04:17"
    subject_es: "Nada para el 31"
    subject_en: "Nothing for the 31st"
    es: "El 31 de octubre hay fecha en San Telmo. No es una fiesta temática. Se pide no venir disfrazado de nada, en particular de nada con cuernos."
    en: "There is a date in San Telmo on October 31. It is not a themed party. Please do not come dressed as anything, in particular anything with horns."

  - num: "018"
    date_es: "14 Ago 2026 · 04:17"
    date_en: "14 Aug 2026 · 04:17"
    subject_es: "Aviso de mantenimiento"
    subject_en: "Maintenance notice"
    es: "Este despacho se envió a las 04:17 por un error de programación. Se revisó el error. Se decidió dejarlo así. Los próximos también van a llegar a esta hora."
    en: "This dispatch went out at 04:17 due to a scheduling error. The error was reviewed. It was decided to keep it. Future dispatches will also arrive at this time."

  - num: "016"
    date_es: "21 Abr 2025 · 04:17"
    date_en: "21 Apr 2025 · 04:17"
    subject_es: "Corrección de dirección"
    subject_en: "Address correction"
    es: "La fiesta del sábado no es en la dirección que mandamos. Es en la de al lado. La persiana es igual; el número no. Quienes ya fueron a la primera dirección: el señor que vive ahí manda saludos y pide que no vuelvan."
    en: "Saturday's party is not at the address we sent. It is next door. The shutter is the same; the number is not. To those who already went to the first address: the gentleman who lives there sends his regards and asks that you not return."

  - num: "014"
    date_es: "03 Mar 2025 · 04:17"
    date_en: "03 Mar 2025 · 04:17"
    subject_es: "Bajas"
    subject_en: "Unsubscribes"
    es: "Cinco personas se dieron de baja este mes. Les deseamos buenas noches. Las coordenadas siguen siendo las mismas, por si pasan."
    en: "Five people unsubscribed this month. We wish them good night. The coordinates are still the same, in case they are in the area."

  - num: "013"
    date_es: "10 Feb 2025 · 04:17"
    date_en: "10 Feb 2025 · 04:17"
    subject_es: "Respuesta colectiva"
    subject_en: "Collective reply"
    es: "Recibimos 214 respuestas al despacho anterior. 211 preguntaban por el búfalo. Las otras tres preguntaban si había guardarropa. Hay guardarropa."
    en: "We received 214 replies to the previous dispatch. 211 asked about the buffalo. The other three asked whether there was a coat check. There is a coat check."

  - num: "011"
    date_es: "18 Nov 2024 · 04:17"
    date_en: "18 Nov 2024 · 04:17"
    subject_es: "Preventa BUF-012"
    subject_en: "BUF-012 pre-order"
    es: "La preventa del EP abre el jueves a las 15:00. Son 300 copias. Se ruega no comprar dos. Quien compre dos va a recibir una, y un mail."
    en: "The EP pre-order opens Thursday at 15:00. There are 300 copies. Please do not buy two. Anyone who buys two will receive one, and an email."

  - num: "007"
    date_es: "09 Oct 2022 · 04:17"
    date_en: "09 Oct 2022 · 04:17"
    subject_es: "Fe de erratas"
    subject_en: "Correction"
    es: "En el despacho anterior figuraba que el set terminaba a las 06:00. Terminó a las 06:15. Pedimos disculpas a quienes se fueron a horario."
    en: "The previous dispatch stated the set would end at 06:00. It ended at 06:15. We apologize to those who left on time."

  - num: "004"
    date_es: "05 Jun 2020 · 04:17"
    date_en: "05 Jun 2020 · 04:17"
    subject_es: "Sin novedades"
    subject_en: "No news"
    es: "No hay fechas este mes. Se avisa igual, para que nadie se preocupe. El sábado hay tres horas en un living de Chacarita. No están invitados. Se escucha desde el pasillo."
    en: "There are no dates this month. We are writing anyway, so nobody worries. On Saturday there are three hours in a Chacarita living room. You are not invited. It can be heard from the hallway."

  - num: "001"
    date_es: "11 Sep 2019 · 04:17"
    date_en: "11 Sep 2019 · 04:17"
    subject_es: "Coordenada"
    subject_en: "Coordinates"
    es: "Taller Ruiz. Sábado. La persiana va a estar a la altura de la rodilla. Agacharse."
    en: "Ruiz's garage. Saturday. The shutter will be at knee height. Duck."
