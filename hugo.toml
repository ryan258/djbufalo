# Local-build default only — deploy.yml passes --baseURL from configure-pages,
# so CI always wins. Point this at https://djbufalo.com/ and add a static/CNAME
# once DNS for the custom domain actually resolves to GitHub.
baseURL = 'https://ryan258.github.io/djbufalo/'
locale = 'es-AR'         # default copy is Spanish; main.js flips <html lang> on toggle
title = 'DJ BUFALO — Never Rushes The Drop'
disableKinds = ['taxonomy', 'term']

[params]
  booking_email = 'booking@djbufalo.com'
  description = 'DJ Bufalo es selector, productor y referente cultural de Buenos Aires. Sesiones continuas, hipnóticas y consistentes sin firuletes. Nunca apura la bajada.'

